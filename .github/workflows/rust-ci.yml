# Rust CI for the FASTER Rust workspace.
# Runs on every push/PR that touches rust/** paths.

name: Rust CI

on:
  push:
    paths: ["rust/**"]
  pull_request:
    paths: ["rust/**"]
  schedule:
    - cron: "0 6 * * 0"   # Every Sunday at 06:00 UTC (for Miri)
  workflow_dispatch:        # Manual trigger (for Miri / benchmarks)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    working-directory: rust

jobs:
  # ── Formatting (nightly, fast-fail) ──────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Lint + Check + Test (matrix) ─────────────────────────────────
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            extra_features: "--features io_uring"
          - os: windows-latest
            extra_features: ""
          - os: macos-latest
            extra_features: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ci-${{ matrix.os }}

      - name: Compile check
        run: cargo check --workspace ${{ matrix.extra_features }}

      - name: Clippy lints
        run: cargo clippy --workspace ${{ matrix.extra_features }} -- -D warnings

      - name: Tests (debug)
        run: cargo test --workspace ${{ matrix.extra_features }}

      - name: Tests (release)
        run: cargo test --workspace --release ${{ matrix.extra_features }}

  # ── Loom Concurrency Tests ───────────────────────────────────────
  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run loom tests
        run: cargo test --features loom -p faster-core --test loom_tests
        env:
          RUSTFLAGS: "--cfg loom"

  # ── DST Smoke Tests (Deterministic Simulation Testing) ───────
  dst:
    name: DST Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run DST core scenarios
        run: cargo nextest run -p faster-dst -E 'not test(campaign_expanded)'
        # Runs 133 tests in ~20s: crash recovery, fault injection, workload validation
        # Extended campaign (1000+ scenarios) runs in nightly/deep validation

  # ── Miri UB Detection ─────────────────────────────────────────────
  miri:
    name: Miri UB Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run miri tests
        run: cargo +nightly miri test -p faster-core --test miri_tests

  # ── Code Coverage ──────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all --features io_uring --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: rust/lcov.info

  # ── Benchmarks (main branch only) ───────────────────────────────
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: bench

      - name: Run benchmarks
        run: cargo bench --workspace --features io_uring --no-fail-fast -- --save-baseline main

  # ── Semver Compatibility Checks (informational pre-1.0) ──────────
  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Informational only — don't fail PRs on semver issues pre-1.0.
    continue-on-error: true
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: semver
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks
      - name: Check semver (faster-core)
        run: cargo semver-checks -p faster-core || echo "⚠️ semver issue in faster-core (informational pre-1.0)"
      - name: Check semver (faster-device)
        run: cargo semver-checks -p faster-device || echo "⚠️ semver issue in faster-device (informational pre-1.0)"
      - name: Check semver (faster-tokio)
        run: cargo semver-checks -p faster-tokio || echo "⚠️ semver issue in faster-tokio (informational pre-1.0)"
      - name: Check semver (faster-uring)
        run: cargo semver-checks -p faster-uring --features io_uring || echo "⚠️ semver issue in faster-uring (informational pre-1.0)"
      - name: Check semver (faster-ffi)
        run: cargo semver-checks -p faster-ffi || echo "⚠️ semver issue in faster-ffi (informational pre-1.0)"

  # ── cargo-deny (license + advisory audit) ────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
