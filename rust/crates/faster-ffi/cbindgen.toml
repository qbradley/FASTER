# cbindgen configuration for generating the FASTER C FFI header.
#
# Usage:
#   cbindgen --config cbindgen.toml --crate faster-ffi --output include/faster.h
#
# Or via the build.rs script (header is regenerated on every build).

language = "C"

# ── Header formatting ────────────────────────────────────────────────
header = """
/* FASTER C FFI — auto-generated by cbindgen. DO NOT EDIT. */
"""
trailer = ""
include_guard = "FASTER_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify. */"
include_version = false

# ── C11 output ───────────────────────────────────────────────────────
style = "both"
cpp_compat = false

[export]
include = [
    "FasterStatus",
    "FasterCheckpointType",
    "FasterCheckpointResult",
    "FasterHandle",
    "INVALID_HANDLE",
]

[export.rename]
# Keep names as-is; the Rust names are already C-friendly.

[fn]
# Emit function declarations for all `#[no_mangle] pub extern "C"` functions.
rename_args = "None"

[enum]
rename_variants = "None"
prefix_with_name = true

[struct]
rename_fields = "None"
