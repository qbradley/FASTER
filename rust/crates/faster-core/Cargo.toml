[package]
name = "faster-core"
version = "0.1.0"
description = "Core KV engine for FASTER — zero async runtime dependencies"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kv-store", "hash-map", "concurrent", "epoch", "hybrid-log"]
categories.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(feature, values("tracing", "metrics", "simulation"))'] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
crossbeam-utils = { workspace = true }
cfg-if = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
loom = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
crc32fast = "1.5.0"
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = "3"

[features]
default = []
# Enable extra runtime assertions for debug/testing builds
paranoid = []
# Enable metrics collection (operation counters, cache-hit rates)
metrics = []
# Enable loom-based deterministic concurrency testing
loom = ["dep:loom"]
# Enable tracing spans/events for observability (zero overhead when disabled)
tracing = ["dep:tracing"]
# Enable deterministic simulation testing (cooperative scheduler, simulated time/channels)
simulation = []

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "ycsb"
harness = false

[[bench]]
name = "hash_layout_bench"
harness = false
