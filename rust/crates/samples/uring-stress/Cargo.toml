[package]
name = "uring-stress"
version = "0.1.0"
description = "io_uring stress test and comparison benchmark for FASTER"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
io_uring = ["faster-uring/io_uring"]

[dependencies]
faster-core = { path = "../../faster-core" }
faster-uring = { path = "../../faster-uring", optional = true }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
